# 首先，给管道起个名字
name: BSN Backend API Pipeline

# 定义当我们需要触发构建时，或者当我们需要触发此管道时
on:
  push: # 当有人向仓库分支推送代码时，会触发推送事件并运行您的工作流。注意：GitHub Actions 可用的 webhook 有效负载不包含提交对象中的 added、removed 和 modified 属性。
    branches: # 通过某些分支触发管道：例如当我们向ci/pipeline分支push一些更改或移除时它会被触发。可使用 * 和 ** 通配符匹配多个分支或标签名称。
      - ci/pipeline
    paths: # 通过某些路径触发管道：这意味着当我在某些特定路径中的代码或文件进行某些更改时，希望触发这个管道。
      - book-network/**
      - docker/backend/**
      - docker-compose.yml
      - .github/workflows/*-backend.yml

jobs: # 定义此管道的工作，工作流运行由一个或多个作业组成。
  compiler: # 编译项目
    name: Compiler project # 工作名称
    runs-on: ubuntu-22.04 # 用于运行该作业的机器类型，例如 ubuntu-20.04。
    steps: # 一个工作包含一系列称为步骤的任务。
      - name: Checkout code
        uses: actions/checkout@v4 # 选择一项操作，作为作业步骤的一部分来执行。
        with: # 使用一个操作时，可以指定或传递一些参数
          fetch-depth: '0' # 要获取的提交数。0 表示获取所有分支和标签的完整历史记录。

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto' # Java 发行版
          java-version: '17' # 要设置的Java版本。接受整数或半版本号的Java版本号
        
      - name: Compiler project
        run: | # 使用操作系统的 shell 运行命令行程序，铺设管道`|`运行多个命令
          cd book-network
          ./mvnw clean compile

  unit-tests: # 单元测试
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Running Unit Tests
        run: |
          cd book-network
          ./mvnw clean test

  build: # 构建
    name: Build backend
    runs-on: ubuntu-22.04
    needs: [compiler, unit-tests] # 标识任何必须成功完成的工作项，才能让当前任务执行。
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Build project
        run: |
          cd book-network
          ./mvnw clean package

  build-image:
    name: Build Docker image
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Extract project version # 提取项目版本号
        id: extract_version # 步骤的唯一标识符。可以在上下文中使用该ID来引用该步骤
        run: | #  执行 echo 命令，创建一个名为 VERSION 的变量，将 Maven Wrapper 命令得到的版本号赋值给 VERSION，然后将其输出保存到 GITHUB_OUTPUT 中。
          cd book-network
          echo "VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:${{ steps.extract_version.outputs.VERSION }}, ${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:latest
          build-args: # 设置构建时参数 (对应 Dockerfile 中的 ARG)
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.VERSION }}
          file: docker/backend/Dockerfile # 指定 Dockerfile 的路径
          context: book-network # 若 Dockerfile 在后端项目根目录下，则无需提供后端项目文件名，为`.`即可
          push: true
          platforms: linux/amd64


  deploy:
    name: Deploy backend
    runs-on: ubuntu-22.04
    needs: [build-image]
    steps:
      - name: Create deployment folder
        uses: appleboy/ssh-action@v1.0.0
        with: 
          host: ${{ secrets.ESC_HOST }}
          username: ${{ secrets.ESC_USERNAME }}
          key: ${{ secrets.ESC_SSH_KEY }}
          port: ${{ secrets.ESC_PORT }}
          script: |
            mkdir -p /ci-cd
      - name: Copy docker-compose.yml to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ESC_HOST }}
          username: ${{ secrets.ESC_USERNAME }}
          key: ${{ secrets.ESC_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/ci-cd/"  # 或你希望放置的目录
          strip_components: 1
        
      - name: Deploy to ESC
        uses: appleboy/ssh-action@v1.0.0
        with: 
          host: ${{ secrets.ESC_HOST }}
          username: ${{ secrets.ESC_USERNAME }}
          key: ${{ secrets.ESC_SSH_KEY }}
          port: ${{ secrets.ESC_PORT }}
          # passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }} 有则添加
          script: |
            # Pull latest image
            docker compose -f docker-compose.yml pull
          
            # 停止并移除旧容器
            docker compose -f docker-compose.yml down
          
            # 启动新容器
            docker compose -f docker-compose.yml up -d
          
            # 清理旧镜像
            docker image prune -f
