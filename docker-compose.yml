services:
  gateway:
    image: nginx:latest
    container_name: bsn-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro # 证书存放在宿主机此处
    networks:
      - spring-demo
    depends_on:
      - bsn-ui
      - bsn-api
      - keycloak
  postgres:
    container_name: postgres-sql-bsn
    image: postgres
    environment:
      POSTGRES_USER: ${PG_DB_USERNAME}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: book_social_network # 容器开始创建数据库
    volumes:
      # 命名卷 (推荐用于持久化数据)
      - postgres_data:/var/lib/postgresql/data
    # ports: - 5432:5432
    networks:
      - spring-demo # 所有容器位于的同一network，
    restart: unless-stopped # 容器的重启策略
  keycloak:
    container_name: keycloak-24
    image: quay.io/keycloak/keycloak:24.0.2
    environment:
      # 数据库类型
      KC_DB: postgres
      # 数据库连接地址（使用服务名 postgres）
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # 数据库用户名和密码
      KC_DB_USERNAME: ${PG_DB_USERNAME}
      KC_DB_PASSWORD: ${PG_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${ALIYUN_ESC_IP}
      KC_HOSTNAME_DEBUG: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HOSTNAME_STRICT: false
      # KC_PROXY: edge
      # KC_PROXY_HEADERS: forwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_FEATURES: token-exchange
    # ports: - 9090:8080 # 删除了外部 ports 映射，仅由 gateway 访问
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      - postgres
    networks:
      - spring-demo
    command: start-dev --import-realm
  bsn-api:
    container_name: bsn-api
    # 原 DockerHub 地址
    # image: handi8/bsn-api:1.0.0
    # 新 ACR 地址
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/bsn-api:1.0.0
    # ports: - 8088:8088 (可选：关闭后外部无法通过 8088 直接访问)
    volumes:
      - bsn-api-storage:/app/uploads
    networks:
      - spring-demo
    depends_on:
      - postgres
  bsn-ui:
    container_name: bsn-ui
    # 原 DockerHub 地址
    # image: handi8/bsn-ui:1.0.0
    # 新 ACR 地址
    image: ${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/bsn-ui:1.0.0
    # ports: - 8080:80 (可选：关闭后只能通过 443 访问)
    networks:
      - spring-demo
    depends_on:
      - bsn-api
networks:
  spring-demo:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  bsn-api-storage:
    driver: local